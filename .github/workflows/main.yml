name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # 🔥 IMPORTANT FIX

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4   # ✅ updated

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Amx-code1
          outputs: |
            dist/github-contribution-grid-snake.svg

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v4   # ✅ replaced old one
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
